<!DOCTYPE html>
<html lang="en">
  <body>
    <!-- Static form skeleton for Netlify build-time detection. Not rendered to users. -->
    <form name="get-involved" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="get-involved" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="involvement" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
